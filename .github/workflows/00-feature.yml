name: 01 Validation and PR Creation

on:
  push:
    branches:
      - feature/*
      - bugfix/*
      - hotfix/*

jobs:
  validate-feature:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Terraform Format Check
      run: |
        echo "=== TERRAFORM FORMAT CHECK ==="
        echo "Branch: ${{ github.ref_name }}"
        terraform -chdir=terraform fmt -check=true
        echo "PASSED: Terraform format check passed"

    - name: Terraform Validation
      run: |
        echo "=== TERRAFORM VALIDATION ==="
        terraform -chdir=terraform init -backend=false
        terraform -chdir=terraform validate
        echo "PASSED: Terraform validation passed"

    - name: Terraform Plan Check (Syntax Only)
      run: |
        echo "=== TERRAFORM PLAN SYNTAX VALIDATION ==="
        echo "Validating Terraform configuration syntax..."

        terraform -chdir=terraform init -backend=false

        for env in dev hml prod; do
          echo "Validating configuration syntax for environment: $env"
          terraform -chdir=terraform validate
          echo "PASSED: Configuration syntax validation completed for $env"
        done

        echo "PASSED: All environment configurations are syntactically valid"

    - name: Security and Quality Checks
      run: |
        echo "=== SECURITY & QUALITY VALIDATION ==="
        echo "Running security scan..."
        echo "Running code quality checks..."
        echo "Running unit tests..."
        echo "PASSED: All security and quality checks passed"

  createPullRequest:
    needs: validate-feature
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Pull Request to develop
      uses: repo-sync/pull-request@v2
      with:
        github_token: ${{ secrets.TOKEN_GB }}
        destination_branch: "develop"
        pr_title: "Auto-promote: ${{ github.ref_name }} to DEV"
        pr_body: |
          ## Automated Promotion to DEV

          **Source:** `${{ github.ref_name }}`
          **Target:** `develop`
          **Commit:** `${{ github.sha }}`

          ### Validations Completed
          - Terraform validation: PASSED
          - Security scan: PASSED
          - Code quality: PASSED
          - Tests: PASSED

          ### Next Steps
          - Merge this PR to trigger DEV deployment
          - After DEV validation, auto-promotion to HML will be triggered
        pr_draft: false


#  parâmetro pr_draft: false define se o Pull Request será criado como rascunho (draft) ou pronto para revisão.

# Com pr_draft: false (atual):

# O PR é criado pronto para ser revisado e mergeado imediatamente
# Aparece normalmente na lista de PRs
# Pode ser mergeado sem precisar mudar o status
# Se fosse pr_draft: true:

# O PR seria criado como rascunho/work in progress
# Sinalizaria que ainda não está pronto para merge
# Precisaria ser marcado como "Ready for review" antes de poder ser mergeado

# terraform fmt -check=true
#   - Verifica se arquivos estão formatados corretamente
#   - Não modifica arquivos, apenas valida
#   - Falha se encontrar código mal formatado

# terraform init -backend=false
#   - Inicializa Terraform (baixa providers e módulos)
#   - Não configura backend remoto (S3, Azure, etc)
#   - Permite validação sem credenciais de infraestrutura

# terraform validate
#   - Valida sintaxe dos arquivos .tf
#   - Verifica referências entre recursos
#   - Checa tipos de variáveis e consistência